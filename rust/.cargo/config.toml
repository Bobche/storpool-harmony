# StorPool Rust 交叉编译配方（自包含，覆盖全局 ~/.cargo/config.toml）
# 坑位备忘（H0 固化）：
#  - DevEco 装在 Program Files（带空格），cc-rs/linker 必须用 8.3 短路径
#  - rustc 1.99 已移除 -C sysroot，sysroot 只能经 link-arg 传递
#  - crates.io 走 rsproxy sparse 镜像（官方源在本机网络下会静默截断）

[source.crates-io]
replace-with = 'rsproxy-sparse'

[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"

[target.aarch64-unknown-linux-ohos]
linker = "C:/PROGRA~1/Huawei/DEVECO~1/sdk/default/OPENHA~1/native/llvm/bin/clang.exe"
rustflags = [
  "-C", "link-arg=--target=aarch64-unknown-linux-ohos",
  "-C", "link-arg=--sysroot=C:/PROGRA~1/Huawei/DEVECO~1/sdk/default/OPENHA~1/native/sysroot",
  "-C", "link-arg=-LC:/PROGRA~1/Huawei/DEVECO~1/sdk/default/OPENHA~1/native/sysroot/usr/lib/aarch64-linux-ohos",
]

[target.x86_64-unknown-linux-ohos]
linker = "C:/PROGRA~1/Huawei/DEVECO~1/sdk/default/OPENHA~1/native/llvm/bin/clang.exe"
rustflags = [
  "-C", "link-arg=--target=x86_64-unknown-linux-ohos",
  "-C", "link-arg=--sysroot=C:/PROGRA~1/Huawei/DEVECO~1/sdk/default/OPENHA~1/native/sysroot",
  "-C", "link-arg=-LC:/PROGRA~1/Huawei/DEVECO~1/sdk/default/OPENHA~1/native/sysroot/usr/lib/x86_64-linux-ohos",
]

# cc-rs 编译 C 依赖（ring 等）所需的工具链（全部短路径）
[env]
OHOS_NATIVE = "C:/PROGRA~1/Huawei/DEVECO~1/sdk/default/OPENHA~1/native"
CC_aarch64_unknown_linux_ohos = "C:/PROGRA~1/Huawei/DEVECO~1/sdk/default/OPENHA~1/native/llvm/bin/clang.exe"
CXX_aarch64_unknown_linux_ohos = "C:/PROGRA~1/Huawei/DEVECO~1/sdk/default/OPENHA~1/native/llvm/bin/clang++.exe"
AR_aarch64_unknown_linux_ohos = "C:/PROGRA~1/Huawei/DEVECO~1/sdk/default/OPENHA~1/native/llvm/bin/llvm-ar.exe"
CFLAGS_aarch64_unknown_linux_ohos = "--sysroot=C:/PROGRA~1/Huawei/DEVECO~1/sdk/default/OPENHA~1/native/sysroot"
CXXFLAGS_aarch64_unknown_linux_ohos = "--sysroot=C:/PROGRA~1/Huawei/DEVECO~1/sdk/default/OPENHA~1/native/sysroot"
CC_x86_64_unknown_linux_ohos = "C:/PROGRA~1/Huawei/DEVECO~1/sdk/default/OPENHA~1/native/llvm/bin/clang.exe"
CXX_x86_64_unknown_linux_ohos = "C:/PROGRA~1/Huawei/DEVECO~1/sdk/default/OPENHA~1/native/llvm/bin/clang++.exe"
AR_x86_64_unknown_linux_ohos = "C:/PROGRA~1/Huawei/DEVECO~1/sdk/default/OPENHA~1/native/llvm/bin/llvm-ar.exe"
CFLAGS_x86_64_unknown_linux_ohos = "--sysroot=C:/PROGRA~1/Huawei/DEVECO~1/sdk/default/OPENHA~1/native/sysroot"
CXXFLAGS_x86_64_unknown_linux_ohos = "--sysroot=C:/PROGRA~1/Huawei/DEVECO~1/sdk/default/OPENHA~1/native/sysroot"