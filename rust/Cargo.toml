[workspace]
resolver = "2"
members = ["storpool-napi"]

# P1-3 Rust 自包含（2026-10-19）：bep-protocol 连同其依赖 syncthing-core 已 vendor 进
# rust/vendor/，仓库 clone 后 cargo build 开箱即用，不再依赖仓库外 ../../h0-research。
# 上游来源与固定版本：github.com/juice094/syncthing-rust @ e89c53f（v3.0.5）
# 交叉编译配方（linker/sysroot/rsproxy 镜像）见 rust/.cargo/config.toml，同样自包含。
[workspace.dependencies]
bep-protocol = { path = "vendor/bep-protocol" }

[profile.release]
opt-level = 2
lto = false