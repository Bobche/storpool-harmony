[package]
name = "syncthing-core"
version = "3.0.5"
edition = "2021"

publish = false

# Vendored from https://github.com/juice094/syncthing-rust @ e89c53f (v3.0.5)
# P1-3 Rust 自包含：原 storpool workspace 经 ../../h0-research 的 path 依赖已消除，
# 本文件依赖版本自上游根 Cargo.toml [workspace.dependencies] 固化而来（benches/dev-deps 未随迁）。

[dependencies]
thiserror = "1.0"
tokio = { version = "1.35", features = ["full"] }
